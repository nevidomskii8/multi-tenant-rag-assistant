services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      - "127.0.0.1:5432:5432"  # localhost only — for running alembic/psql from the host
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # llm-guard sidecar (Phase 3). Heavy model set (Presidio/spaCy + DeBERTa) runs
  # here, not in the app image, so the two failure domains stay decoupled (ADR-005).
  # Pinned tag; CPU variant. Not published on the host — only the app reaches it.
  llm-guard-api:
    image: laiyer/llm-guard-api:0.3.16
    environment:
      AUTH_TOKEN: ${GUARDRAILS_AUTH_TOKEN:-dev-guardrails-token}
      LOG_LEVEL: ${GUARDRAILS_LOG_LEVEL:-INFO}
    volumes:
      - ./guardrails/scanners.yml:/home/user/app/config/scanners.yml:ro
    healthcheck:
      # Image ships python (it's a python app) but not necessarily curl.
      test: ["CMD-SHELL", "python -c \"import urllib.request as u,sys; sys.exit(0 if u.urlopen('http://localhost:8000/readyz').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s  # first boot downloads/loads the scanner models

  app:
    build: .
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-app}
      # Request path runs as the non-owner app_rt role so RLS is enforced.
      APP_RT_PASSWORD: ${APP_RT_PASSWORD:-app_rt}
      RUNTIME_DATABASE_URL: postgresql://app_rt:${APP_RT_PASSWORD:-app_rt}@db:5432/${POSTGRES_DB:-app}
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-change-me}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-haiku-4-5}
      # Guardrail sidecar. Calls are fail-closed, so the app only serves once the
      # sidecar is healthy (depends_on below).
      GUARDRAILS_URL: ${GUARDRAILS_URL:-http://llm-guard-api:8000}
      GUARDRAILS_AUTH_TOKEN: ${GUARDRAILS_AUTH_TOKEN:-dev-guardrails-token}
      # Observability
      LOKI_URL: ${LOKI_URL:-http://loki:3100}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-dev-secret}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-dev-public}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse:3000}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # Rate limiting (LLM10)
      RATE_LIMIT_REQUESTS_PER_MIN: ${RATE_LIMIT_REQUESTS_PER_MIN:-60}
      RATE_LIMIT_TOKENS_PER_HOUR: ${RATE_LIMIT_TOKENS_PER_HOUR:-100000}
    volumes:
      # Live-mount the `app` package over its image copy for --reload.
      # Target is /app/app: WORKDIR is /app, the package itself is `app`.
      - ./app:/app/app
      # Synthetic fixtures for the operator PII seed (`python -m app.pii`). Read-only:
      # the container reads data/pii/*.json but never writes here.
      - ./data:/app/data:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      db:
        condition: service_healthy
      llm-guard-api:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  # ============================================================================
  # Observability stack (Phase 5)
  # ============================================================================

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - app
      - alertmanager

  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes:
      - ./observability/alertmanager:/etc/alertmanager:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    ports:
      - "127.0.0.1:9093:9093"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9093/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  loki:
    image: grafana/loki:3.0.0
    volumes:
      - ./observability/loki:/etc/loki:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "127.0.0.1:3100:3100"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  langfuse-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${LANGFUSE_DB_PASSWORD:-langfuse}
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 5s
      timeout: 3s
      retries: 5

  langfuse:
    image: langfuse/langfuse:2
    environment:
      DATABASE_URL: postgresql://langfuse:${LANGFUSE_DB_PASSWORD:-langfuse}@langfuse-db:5432/langfuse
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-dev-nextauth-secret}
      NEXTAUTH_URL: http://localhost:3001
      SALT: ${LANGFUSE_SALT:-dev-salt-1234567890}
      TELEMETRY_ENABLED: "false"
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      langfuse-db:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - loki

volumes:
  pgdata:
  prometheus_data:
  alertmanager_data:
  loki_data:
  langfuse_pgdata:
  grafana_data:
