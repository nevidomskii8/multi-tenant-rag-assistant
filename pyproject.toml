[project]
name = "multi-tenant-rag-assistant"
version = "0.0.0"
description = "Multi-tenant RAG assistant over private data"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "anthropic>=0.49",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "pgvector>=0.3",
    "sentence-transformers>=3.3",
    "pyjwt>=2.10",
    "bcrypt>=4.2",
    # Request-path HTTP client for the llm-guard sidecar (Phase 3). Also pulled in
    # transitively by anthropic, but the guardrail call depends on it directly.
    "httpx>=0.27",
    # Observability
    "prometheus-client>=0.21",
    "structlog>=24.4",
    # NOTE: We do NOT use python-logging-loki. Its LokiHandler does synchronous
    # HTTP on every log line, blocking requests if Loki is slow/down. Instead,
    # logs go to stdout and Promtail/Alloy ships them to Loki asynchronously.
    "langfuse>=2.51,<3",  # SDK v2 for langfuse/langfuse:2 server
    # Rate limiting (LLM10)
    "slowapi>=0.1",
    "redis>=5.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom puts Depends()/Security() in defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Security", "fastapi.Query"]

[tool.pytest.ini_options]
testpaths = ["tests"]
