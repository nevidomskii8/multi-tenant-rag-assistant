# Alertmanager configuration (Phase 5)
#
# Default config routes alerts to a "null" receiver (logged but not delivered).
# To enable real notifications, add receivers for your channels:
# - Slack: https://prometheus.io/docs/alerting/latest/configuration/#slack_config
# - Email: https://prometheus.io/docs/alerting/latest/configuration/#email_config
# - Webhook: https://prometheus.io/docs/alerting/latest/configuration/#webhook_config

global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'

  # Route critical alerts to a separate receiver (when configured)
  routes:
    - match:
        severity: critical
      receiver: 'critical'
      continue: true

receivers:
  # Default receiver — logs alerts but does not deliver them externally.
  # Replace with real integrations in production.
  - name: 'default'
    # Webhook to a local endpoint for dev/debugging (optional):
    # webhook_configs:
    #   - url: 'http://app:8000/webhooks/alerts'

  # Critical alerts receiver — same as default until configured.
  # In production, add PagerDuty, Slack, or on-call webhook here.
  - name: 'critical'
    # pagerduty_configs:
    #   - service_key: '<your-pagerduty-key>'
    # slack_configs:
    #   - api_url: '<your-slack-webhook>'
    #     channel: '#alerts-critical'

# Inhibition rules: suppress lower-severity alerts when critical fires.
inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname']
